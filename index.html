<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Sorter</title>
<style>
body{font-family:Arial;background:#fff7ed;padding:25px}
main{max-width:650px;margin:auto;background:white;padding:30px;border-radius:16px}
textarea{width:100%;height:180px;padding:15px;box-sizing:border-box;margin:10px 0;border:1px solid #fdba74;border-radius:8px}
button{background:#ea580c;color:white;border:0;padding:12px 15px;margin:4px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>Text Sorter</h1>
<p>Organize and clean your text lists.</p>
<textarea id="input" placeholder="Enter one item per line"></textarea>
<button onclick="process('asc')">Sort A-Z</button>
<button onclick="process('desc')">Sort Z-A</button>
<button onclick="process('unique')">Remove Duplicates</button>
<textarea id="output" readonly placeholder="Processed text"></textarea>
<button onclick="copyText()">Copy Result</button>
<p id="status"></p>
</main>
<script>
function process(mode){
 let lines=document.getElementById("input").value
 .split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
 if(mode==="asc")lines.sort((a,b)=>a.localeCompare(b));
 if(mode==="desc")lines.sort((a,b)=>b.localeCompare(a));
 if(mode==="unique")lines=[...new Set(lines)];
 document.getElementById("output").value=lines.join("\n");
 document.getElementById("status").textContent="Total lines: "+lines.length;
}
async function copyText(){
 try{
  await navigator.clipboard.writeText(document.getElementById("output").value);
  document.getElementById("status").textContent="Copied!";
 }catch{
  document.getElementById("status").textContent="Please copy manually.";
 }
}
</script>
</body>
</html>
