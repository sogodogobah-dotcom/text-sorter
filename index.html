<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Text Sorter</title>
<style>
body{font-family:Arial;background:#f8fafc;padding:25px}
main{max-width:650px;margin:auto;background:white;padding:25px;border-radius:15px}
textarea{width:100%;height:180px;padding:12px;box-sizing:border-box}
button{padding:11px 16px;margin:8px 5px 8px 0;background:#334155;color:white;border:0;border-radius:7px;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>Text Sorter</h1>
<p>Enter one item per line.</p>
<textarea id="input" placeholder="Banana&#10;Apple&#10;Mango"></textarea>
<br>
<button onclick="sortText(false)">A to Z</button>
<button onclick="sortText(true)">Z to A</button>
<button onclick="removeDuplicates()">Remove Duplicates</button>
<textarea id="output" readonly placeholder="Sorted result"></textarea>
<button onclick="copyResult()">Copy Result</button>
<p id="status"></p>
</main>
<script>
function getLines(){
 return document.getElementById("input").value
 .split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
}
function sortText(desc){
 const lines=getLines();
 lines.sort((a,b)=>a.localeCompare(b,undefined,{sensitivity:"base"}));
 if(desc)lines.reverse();
 document.getElementById("output").value=lines.join("\n");
}
function removeDuplicates(){
 const unique=[...new Set(getLines())];
 document.getElementById("output").value=unique.join("\n");
}
async function copyResult(){
 try{
  await navigator.clipboard.writeText(document.getElementById("output").value);
  document.getElementById("status").textContent="Copied successfully.";
 }catch{
  document.getElementById("status").textContent="Please copy manually.";
 }
}
</script>
</body>
</html>
